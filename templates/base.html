<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        StudySpark
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<header class="main-header">

    <div class="container navigation">

        <a
            class="logo"
            href="{{ url_for('home') }}"
        >
            StudySpark
        </a>

        <nav>
            <a href="{{ url_for('home') }}">
                Dashboard
            </a>

            <a href="{{ url_for('notes') }}">
                Notes
            </a>

            <a href="{{ url_for('flashcards') }}">
                Flashcards
            </a>
        </nav>

    </div>

</header>

<main class="container">

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            {% for category, message in messages %}

                <div class="message {{ category }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}

    {% block content %}
    {% endblock %}

</main>

<footer>
    <p>
        StudySpark 
    </p>
</footer>

</body>
</html>
